name: 자동 SEO 콘텐츠 발행

on:
  # 수동 실행 — GitHub Actions 탭에서 키워드 입력 후 실행
  workflow_dispatch:
    inputs:
      keyword:
        description: '블로그 키워드 (예: 작심삼일 극복하는 방법)'
        required: true
        type: string

  # 자동 스케줄 — 매주 월·수·금 오전 9시 (KST = UTC+9 → UTC 0시)
  schedule:
    - cron: '0 0 * * 1,3,5'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 키워드 결정
        id: keyword
        run: |
          if [ -n "${{ github.event.inputs.keyword }}" ]; then
            echo "keyword=${{ github.event.inputs.keyword }}" >> $GITHUB_OUTPUT
          else
            # 스케줄 실행 시 키워드 풀에서 순환 선택
            KEYWORDS=(
              "작심삼일 극복하는 방법"
              "목표 달성 습관 만들기"
              "자기계발 루틴 만드는 법"
              "비전보드 만들기 방법"
              "S=BTA 성공 방법론"
              "성공하는 사람들의 아침 루틴"
              "목표 관리 앱 추천"
              "자기계발 동기부여 방법"
              "작심삼일 반복하는 이유"
              "꿈과 목표의 차이"
              "신념이 성공을 만드는 이유"
              "하루 3분 자기계발 습관"
            )
            # 날짜 기반 순환 인덱스
            DAY_OF_YEAR=$(date +%j)
            INDEX=$(( DAY_OF_YEAR % ${#KEYWORDS[@]} ))
            echo "keyword=${KEYWORDS[$INDEX]}" >> $GITHUB_OUTPUT
          fi

      - name: 블로그 글 자동 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-content.mjs "${{ steps.keyword.outputs.keyword }}"

      - name: Git 설정
        run: |
          git config user.name  "seowoo-bot"
          git config user.email "bot@seowoo.kr"

      - name: 생성된 글 커밋 & 푸시
        run: |
          git add content/posts/
          git diff --staged --quiet || git commit -m "post: ${{ steps.keyword.outputs.keyword }} ($(date +%Y-%m-%d))"
          git push

      - name: Google 색인 요청
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: node scripts/google-indexing.mjs
        continue-on-error: true
